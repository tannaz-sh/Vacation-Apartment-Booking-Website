name: Quality
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: support_review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d support_review_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:cms
        env:
          TEST_DATABASE_URL: postgresql://review:isolated-ci-only@127.0.0.1:5432/support_review_test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:cms:ui
        env:
          TEST_DATABASE_URL: postgresql://review:isolated-ci-only@127.0.0.1:5432/support_review_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
