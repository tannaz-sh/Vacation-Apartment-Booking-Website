name: Quality
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rf_sauerland_test
          POSTGRES_USER: rf_app
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U rf_app -d rf_sauerland_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rf_app:ci-only-password@127.0.0.1:5432/rf_sauerland_test
      PAYLOAD_SECRET: ci-only-payload-secret-at-least-thirty-two-characters
      PAYLOAD_DB_PUSH: 'true'
      SITE_URL: http://127.0.0.1:3000
      SMOOBU_BOOKING_URL: https://booking.smoobu.com/9A1947006
      SMOOBU_BOOKING_HOST: booking.smoobu.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cms:types
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
